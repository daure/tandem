[package]
name = "tandem"
version = "0.1.0"
edition = "2024"
default-run = "tandem"
description = "A keyboard-first TUI with MCP access"
readme = "README.md"
license = "MIT OR Apache-2.0"
documentation = "https://docs.rs/tandem"
homepage = "https://github.com/daure/tandem"
repository = "https://github.com/daure/tandem"
keywords = ["tui", "terminal", "mcp"]
categories = ["command-line-utilities"]
include = ["Cargo.toml", "Cargo.lock", "README.md", "agent-instructions.md", "src/**"]

[lib]
name = "tandem"
path = "src/lib.rs"

[[bin]]
name = "tandem"
path = "src/main.rs"

[dependencies]
axum = "0.8"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
dirs = "6"
libc = "0.2"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
rmcp = { version = "0.12", features = ["server", "macros", "transport-async-rw", "transport-io", "transport-streamable-http-server"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "io-util", "net", "signal"] }
tracing-appender = "0.2"
tuicore = { path = "../tuicore" }

[dev-dependencies]
tempfile = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "off"
strip = "symbols"
